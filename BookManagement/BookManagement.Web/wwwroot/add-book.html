<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Thêm sách mới vào hệ thống Book Management." />
  <title>Thêm Sách Mới</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="main-content">
      <header class="top-header" id="top-header"></header>

      <main class="page-content">
        <h1 class="page-title">➕ Thêm Sách Mới</h1>
        <p class="page-subtitle">Nhập thông tin sách để thêm vào hệ thống</p>

        <div class="form-container">
          <div class="form-card">
            <form id="add-book-form" novalidate>
              <div class="form-group">
                <label class="form-label" for="title">Tiêu đề <span style="color:var(--error)">*</span></label>
                <input type="text" class="form-control" id="title" placeholder="Nhập tiêu đề sách" required />
                <div class="form-error hidden" id="title-error">Tiêu đề là bắt buộc!</div>
              </div>

              <div class="form-group">
                <label class="form-label" for="author">Tác giả <span style="color:var(--error)">*</span></label>
                <input type="text" class="form-control" id="author" placeholder="Nhập tên tác giả" required />
                <div class="form-error hidden" id="author-error">Tác giả là bắt buộc!</div>
              </div>

              <div class="form-group">
                <label class="form-label">Thể loại</label>
                <div id="genre-selector"></div>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label class="form-label" for="isbn">ISBN</label>
                  <input type="text" class="form-control" id="isbn" placeholder="Nhập mã ISBN" />
                </div>
                <div class="form-group">
                  <label class="form-label" for="price">Giá (VNĐ)</label>
                  <input type="number" class="form-control" id="price" placeholder="Nhập giá" min="0" />
                </div>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label class="form-label" for="publish-date">Ngày xuất bản</label>
                  <input type="date" class="form-control" id="publish-date" />
                </div>
                <div class="form-group">
                  <label class="form-label" for="page-count">Số trang</label>
                  <input type="number" class="form-control" id="page-count" placeholder="Nhập số trang" min="1" />
                </div>
              </div>

              <div class="form-group">
                <label class="form-label" for="description">Mô tả / Tóm tắt nội dung</label>
                <textarea class="form-control" id="description" rows="4" placeholder="Nhập tóm tắt nội dung sách..."></textarea>
              </div>

              <div class="form-group">
                <label class="form-label">Ảnh bìa sách</label>
                <div class="file-upload">
                  <div class="file-upload-area" id="upload-area">
                    <div class="upload-icon">📁</div>
                    <div class="upload-text"><strong>Bấm để chọn</strong> hoặc kéo thả ảnh vào đây</div>
                    <div class="upload-text" style="font-size:0.75rem; margin-top:4px">PNG, JPG, JPEG (tối đa 10MB)</div>
                  </div>
                  <input type="file" id="cover-file" accept=".png,.jpg,.jpeg" />
                  <div class="file-preview hidden" id="file-preview">
                    <img id="preview-img" alt="Preview" />
                    <span id="preview-name"></span>
                    <button type="button" class="btn btn-danger btn-sm" id="remove-file" style="margin-left:auto">✕</button>
                  </div>
                </div>
              </div>

              <div class="form-card-actions">
                <a href="/" class="btn btn-ghost">Huỷ</a>
                <button type="submit" class="btn btn-primary" id="btn-submit">
                  Lưu Sách
                </button>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    let genreSelector;
    let selectedFile = null;

    document.addEventListener('DOMContentLoaded', () => {
      if (!Auth.requireAdmin()) return;

      genreSelector = new GenreSelector('genre-selector');
      setupFileUpload();
      setupForm();
    });

    function setupFileUpload() {
      const area = document.getElementById('upload-area');
      const input = document.getElementById('cover-file');
      const preview = document.getElementById('file-preview');
      const previewImg = document.getElementById('preview-img');
      const previewName = document.getElementById('preview-name');
      const removeBtn = document.getElementById('remove-file');

      area.addEventListener('click', () => input.click());

      area.addEventListener('dragover', (e) => {
        e.preventDefault();
        area.style.borderColor = 'var(--accent-primary)';
      });
      area.addEventListener('dragleave', () => {
        area.style.borderColor = '';
      });
      area.addEventListener('drop', (e) => {
        e.preventDefault();
        area.style.borderColor = '';
        if (e.dataTransfer.files.length > 0) {
          handleFile(e.dataTransfer.files[0]);
        }
      });

      input.addEventListener('change', () => {
        if (input.files.length > 0) {
          handleFile(input.files[0]);
        }
      });

      removeBtn.addEventListener('click', () => {
        selectedFile = null;
        preview.classList.add('hidden');
        area.classList.remove('hidden');
        input.value = '';
      });

      function handleFile(file) {
        selectedFile = file;
        previewName.textContent = file.name;
        previewImg.src = URL.createObjectURL(file);
        preview.classList.remove('hidden');
        area.classList.add('hidden');
      }
    }

    function setupForm() {
      const form = document.getElementById('add-book-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Validate
        const title = document.getElementById('title').value.trim();
        const author = document.getElementById('author').value.trim();
        let valid = true;

        if (!title) {
          document.getElementById('title-error').classList.remove('hidden');
          valid = false;
        } else {
          document.getElementById('title-error').classList.add('hidden');
        }

        if (!author) {
          document.getElementById('author-error').classList.remove('hidden');
          valid = false;
        } else {
          document.getElementById('author-error').classList.add('hidden');
        }

        if (!valid) return;

        const btn = document.getElementById('btn-submit');
        btn.disabled = true;
        btn.innerHTML = '<div class="spinner"></div> Đang lưu...';

        try {
          // Upload image first if selected
          let coverUrl = '';
          if (selectedFile) {
            const formData = new FormData();
            formData.append('file', selectedFile);
            const uploadRes = await Api.postForm(CONFIG.API_UPLOAD, formData);
            if (!uploadRes.ok) {
              const err = await readApiError(uploadRes, 'Tải ảnh thất bại.');
              throw new Error('Lỗi tải ảnh: ' + err);
            }
            const uploadData = await uploadRes.json();
            coverUrl = uploadData.url;
          }

          // Create book
          const isbn = document.getElementById('isbn').value.trim();
          const price = document.getElementById('price').value;
          const publishDate = document.getElementById('publish-date').value;

          const description = document.getElementById('description').value.trim();
          const pageCount = document.getElementById('page-count').value;

          const bookData = {
            title,
            author,
            genres: genreSelector.getSelectedString(),
            isbn: isbn || '',
            price: price ? parseFloat(price) : null,
            coverUrl,
            publishDate: publishDate || null,
            description: description || '',
            pageCount: pageCount ? parseInt(pageCount) : null
          };

          const res = await Api.post(CONFIG.API_BOOKS, bookData);
          if (!res.ok) {
            const err = await readApiError(res, 'Thêm sách thất bại.');
            throw new Error(err);
          }

          Toast.success('Thêm sách thành công!');
          window.location.href = '/';
        } catch (err) {
          Toast.error(err.message);
          btn.disabled = false;
          btn.textContent = 'Lưu Sách';
        }
      });
    }
  </script>
</body>
</html>
