<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nạp tiền — Book Management</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="main-content">
      <header class="top-header" id="top-header"></header>

      <main class="page-content">
        <h1 class="page-title">Nạp tiền vào ví</h1>
        <p class="page-subtitle">Số dư sẽ được dùng để mua sách trong hệ thống</p>

        <div style="max-width: 600px; margin: 30px auto; background: var(--bg-card); padding: 40px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.05);">
          
          <div style="text-align: center; margin-bottom: 30px;">
            <div style="font-size: 3rem; margin-bottom: 10px;">💳</div>
            <h2 style="font-size: 1.5rem; margin-bottom: 5px;">Số dư hiện tại</h2>
            <div id="current-balance" style="font-size: 2.5rem; font-weight: 800; color: var(--accent-primary);">Đang tải...</div>
          </div>

          <div style="margin-bottom: 25px;">
            <label style="font-weight: 600; display: block; margin-bottom: 10px;">Chọn mệnh giá nạp nhanh:</label>
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;">
              <button class="btn btn-outline-primary amount-btn" data-val="50000">50.000đ</button>
              <button class="btn btn-outline-primary amount-btn" data-val="100000">100.000đ</button>
              <button class="btn btn-outline-primary amount-btn" data-val="500000">500.000đ</button>
            </div>
          </div>

          <div style="margin-bottom: 30px;">
            <label style="font-weight: 600; display: block; margin-bottom: 10px;">Hoặc nhập số tiền tùy ý (VNĐ):</label>
            <input type="number" id="custom-amount" class="form-control" placeholder="Ví dụ: 250000" style="width: 100%; font-size: 1.2rem; padding: 15px;">
          </div>

          <button id="btn-submit-deposit" class="btn btn-primary btn-lg" style="width: 100%; font-weight: bold;">Xác nhận nạp tiền</button>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!Auth.requireLogin()) return;
      await loadBalance();
      setupEvents();
    });

    async function loadBalance() {
      try {
        // Gọi API lấy thông tin user hiện tại (để biết số dư ví)
        const res = await Api.get(CONFIG.API_ME);
        if (res.ok) {
          const data = await res.json();
          document.getElementById('current-balance').textContent = formatPrice(data.balance || 0);
        } else {
          document.getElementById('current-balance').textContent = '0 VNĐ';
        }
      } catch (e) {
        document.getElementById('current-balance').textContent = 'Lỗi kết nối';
      }
    }

    function setupEvents() {
      const customInput = document.getElementById('custom-amount');
      
      // Xử lý khi bấm nút mệnh giá
      document.querySelectorAll('.amount-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          customInput.value = e.target.getAttribute('data-val');
        });
      });

      // Xử lý nạp tiền
      document.getElementById('btn-submit-deposit').addEventListener('click', async (e) => {
        const amount = Number(customInput.value);
        if (!amount || amount < 10000) {
          Toast.error('Vui lòng nhập số tiền hợp lệ (tối thiểu 10.000đ).');
          return;
        }

        const btn = e.target;
        const oldText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner spinner-sm"></span> Đang xử lý giao dịch...';

        try {
          // GỌI API NẠP TIỀN Ở ĐÂY (Giả lập gửi request lên Backend)
          // Tùy theo Backend của bro, URL có thể khác. Dùng tạm transaction type: 1 (Nạp tiền)
          const res = await Api.post(CONFIG.API_TRANSACTIONS + '/deposit', { amount: amount });
          
          if (res.ok) {
            Toast.success(`Nạp thành công ${formatPrice(amount)} vào ví!`);
            customInput.value = '';
            await loadBalance(); // Load lại số dư mới
          } else {
            Toast.error('Giao dịch thất bại. Vui lòng thử lại sau.');
          }
        } catch {
          Toast.error('Mạng bị lỗi, không thể kết nối tới máy chủ.');
        } finally {
          btn.disabled = false;
          btn.innerHTML = oldText;
        }
      });
    }
  </script>
</body>
</html>
