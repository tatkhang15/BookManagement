<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Khôi phục mật khẩu Book Management." />
  <title>Quên mật khẩu — Book Management</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-layout">
    <div class="auth-card">
      <div style="text-align:center; margin-bottom:8px; font-size:2.5rem;">🔑</div>
      <h1 class="auth-title">Khôi phục mật khẩu</h1>
      <p class="auth-subtitle">Nhập email để nhận liên kết đặt lại mật khẩu</p>

      <div class="alert alert-success hidden" id="success-alert">
        Hệ thống đã tạo luồng khôi phục mật khẩu. Kiểm tra email hoặc <a href="/reset-password.html" id="reset-link"><strong>bấm vào đây</strong></a>.
      </div>

      <div id="step-1">
        <form id="forgot-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input type="email" class="form-control" id="email" placeholder="Nhập email đã đăng ký" required />
            <div class="form-error hidden" id="email-error">Vui lòng nhập Email hợp lệ</div>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-submit">Gửi liên kết</button>

          <div class="auth-footer">
            <a href="/login.html">← Quay lại trang Đăng nhập</a>
          </div>
        </form>
      </div>

      <div id="step-2" class="hidden">
        <div class="alert alert-success" style="margin-bottom: 20px;">
          Một mã OTP gồm 4 chữ số đã được gửi đến email <strong id="display-email"></strong>.
        </div>
        <form id="otp-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="otp">Mã OTP</label>
            <input type="text" class="form-control" id="otp" placeholder="1234" required maxlength="4" style="font-size: 1.5rem; letter-spacing: 5px; text-align: center;" />
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-verify">Xác nhận OTP</button>

          <div class="auth-footer">
            <a href="javascript:void(0)" onclick="backToStep1()">← Nhập lại email</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    let currentEmail = '';

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('forgot-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value.trim();
        if (!email || !email.includes('@')) {
          document.getElementById('email-error').classList.remove('hidden');
          return;
        }
        document.getElementById('email-error').classList.add('hidden');

        const btn = document.getElementById('btn-submit');
        btn.disabled = true;
        btn.innerHTML = '<div class="spinner"></div> Đang gửi...';

        try {
          const res = await fetch(CONFIG.AUTH_FORGOT, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });

          if (res.ok) {
            currentEmail = email;
            document.getElementById('display-email').textContent = email;
            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-2').classList.remove('hidden');
          } else {
            Toast.error('Gửi yêu cầu thất bại');
          }
        } catch (err) {
          Toast.error('Lỗi: ' + err.message);
        } finally {
          btn.disabled = false;
          btn.textContent = 'Gửi liên kết';
        }
      });

      document.getElementById('otp-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const otp = document.getElementById('otp').value.trim();
        if (!otp) return Toast.warning('Vui lòng nhập OTP');

        const btn = document.getElementById('btn-verify');
        btn.disabled = true;
        btn.innerHTML = '<div class="spinner"></div> Đang xác nhận...';

        try {
          const res = await fetch('/api/auth/verify-forgot-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: currentEmail, otp })
          });

          const data = await res.json().catch(() => null);

          if (res.ok && data?.token) {
            Toast.success('Xác nhận thành công! Đang chuyển hướng...');
            const resetUrl = `/reset-password.html?email=${encodeURIComponent(data.email)}&token=${encodeURIComponent(data.token)}`;
            setTimeout(() => window.location.href = resetUrl, 1000);
          } else {
            Toast.error(data?.message || 'OTP không chính xác');
          }
        } catch (err) {
          Toast.error('Lỗi: ' + err.message);
        } finally {
          btn.disabled = false;
          btn.textContent = 'Xác nhận OTP';
        }
      });
    });

    function backToStep1() {
      document.getElementById('step-2').classList.add('hidden');
      document.getElementById('step-1').classList.remove('hidden');
    }
  </script>
</body>
</html>
