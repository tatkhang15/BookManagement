<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Đặt lại mật khẩu Book Management." />
  <title>Đặt lại mật khẩu — Book Management</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-layout">
    <div class="auth-card">
      <div style="text-align:center; margin-bottom:8px; font-size:2.5rem;">🔒</div>
      <h1 class="auth-title">Đặt lại mật khẩu</h1>
      <p class="auth-subtitle">Nhập mật khẩu mới cho tài khoản của bạn</p>

      <div class="alert alert-error hidden" id="error-alert"></div>

      <!-- Invalid token state -->
      <div class="hidden" id="invalid-token">
        <div class="alert alert-warning">
          ⚠️ Liên kết đặt lại mật khẩu không hợp lệ hoặc đã hết hạn.
        </div>
        <div class="auth-footer">
          <a href="/forgot-password.html">Tạo lại liên kết khôi phục</a>
        </div>
      </div>

      <!-- Form -->
      <form id="reset-form" class="hidden" novalidate>
        <div class="form-group">
          <label class="form-label" for="password">Mật khẩu mới</label>
          <div class="password-wrapper">
            <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu mới" required autocomplete="new-password" />
            <button type="button" class="password-toggle" id="toggle-password">👁️</button>
          </div>
          <div class="form-error hidden" id="password-error">Mật khẩu phải có ít nhất 6 ký tự</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm-password">Xác nhận mật khẩu mới</label>
          <div class="password-wrapper">
            <input type="password" class="form-control" id="confirm-password" placeholder="Nhập lại mật khẩu" required autocomplete="new-password" />
            <button type="button" class="password-toggle" id="toggle-confirm">👁️</button>
          </div>
          <div class="form-error hidden" id="confirm-error">Mật khẩu xác nhận không khớp</div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-submit">Xác nhận đổi mật khẩu</button>
      </form>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const email = getQueryParam('email');
      const token = getQueryParam('token');
      const errorParam = getQueryParam('error');

      if (errorParam) {
        const el = document.getElementById('error-alert');
        el.textContent = decodeURIComponent(errorParam);
        el.classList.remove('hidden');
      }

      if (!email || !token) {
        document.getElementById('invalid-token').classList.remove('hidden');
        return;
      }

      document.getElementById('reset-form').classList.remove('hidden');

      // Password toggles
      document.getElementById('toggle-password').addEventListener('click', () => {
        const pw = document.getElementById('password');
        pw.type = pw.type === 'password' ? 'text' : 'password';
      });
      document.getElementById('toggle-confirm').addEventListener('click', () => {
        const pw = document.getElementById('confirm-password');
        pw.type = pw.type === 'password' ? 'text' : 'password';
      });

      // Form
      document.getElementById('reset-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm-password').value;
        let valid = true;

        if (!password || password.length < 6) {
          document.getElementById('password-error').classList.remove('hidden'); valid = false;
        } else { document.getElementById('password-error').classList.add('hidden'); }

        if (confirm !== password) {
          document.getElementById('confirm-error').classList.remove('hidden'); valid = false;
        } else { document.getElementById('confirm-error').classList.add('hidden'); }

        if (!valid) return;

        const btn = document.getElementById('btn-submit');
        btn.disabled = true;
        btn.innerHTML = '<div class="spinner"></div> Đang xử lý...';

        try {
          const res = await fetch(CONFIG.AUTH_RESET, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, token, newPassword: password })
          });

          if (!res.ok) {
            const data = await res.json().catch(() => null);
            const msg = Array.isArray(data) ? data.join('\n') : (data?.message || 'Đặt lại mật khẩu thất bại');
            throw new Error(msg);
          }

          Toast.success('Đặt lại mật khẩu thành công!');
          window.location.href = '/login.html?message=' + encodeURIComponent('Đặt lại mật khẩu thành công. Vui lòng đăng nhập.');
        } catch (err) {
          const errorEl = document.getElementById('error-alert');
          errorEl.textContent = err.message;
          errorEl.classList.remove('hidden');
          btn.disabled = false;
          btn.textContent = 'Xác nhận đổi mật khẩu';
        }
      });
    });
  </script>
</body>
</html>
