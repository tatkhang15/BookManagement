<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng ký - Book Management</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .auth-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg-body); padding: 20px; }
    .auth-card { background: var(--bg-card); width: 100%; max-width: 480px; padding: 40px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); border: 1px solid var(--border); }
    .auth-header { text-align: center; margin-bottom: 30px; }
    .auth-logo { font-size: 3rem; margin-bottom: 10px; display: inline-block; }
    .auth-title { font-size: 1.8rem; font-weight: 800; color: var(--text-primary); margin-bottom: 5px; }
    .auth-subtitle { color: var(--text-secondary); font-size: 0.95rem; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
    @media (max-width: 480px) { .form-row { grid-template-columns: 1fr; gap: 0; } .form-row > div { margin-bottom: 20px; } }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="/" style="text-decoration: none;"><span class="auth-logo">📚</span></a>
        <h1 class="auth-title">Tạo tài khoản</h1>
        <p class="auth-subtitle">Tham gia cộng đồng yêu sách</p>
      </div>

      <div id="step-1">
        <form id="register-form" onsubmit="handleRegisterStep1(event)">
          <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-primary);">Họ và tên</label>
            <input type="text" id="fullname" class="form-control" placeholder="Nguyễn Văn A" required style="width: 100%; padding: 12px;">
          </div>

          <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-primary);">Tên đăng nhập</label>
            <input type="text" id="username" class="form-control" placeholder="nguyenvana" required style="width: 100%; padding: 12px;">
          </div>

          <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-primary);">Email</label>
            <input type="email" id="email" class="form-control" placeholder="name@example.com" required style="width: 100%; padding: 12px;">
          </div>

          <div class="form-row">
            <div>
              <label style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-primary);">Mật khẩu</label>
              <input type="password" id="password" class="form-control" placeholder="••••••••" required style="width: 100%; padding: 12px;">
            </div>
            <div>
              <label style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-primary);">Nhập lại mật khẩu</label>
              <input type="password" id="confirm-password" class="form-control" placeholder="••••••••" required style="width: 100%; padding: 12px;">
            </div>
          </div>

          <button type="submit" id="btn-register" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 1rem; font-weight: 700; margin-top: 10px;">Tiếp tục</button>
        </form>

        <div style="text-align: center; margin-top: 25px; font-size: 0.95rem; color: var(--text-secondary);">
          Đã có tài khoản? <a href="/login.html" style="color: var(--accent-primary); font-weight: 700; text-decoration: none;">Đăng nhập</a>
        </div>
      </div>

      <div id="step-2" class="hidden">
        <div class="alert alert-success" style="margin-bottom: 20px;">
          Một mã OTP gồm 4 chữ số đã được gửi đến email <strong id="display-email"></strong>. Vui lòng kiểm tra hộp thư của bạn (hoặc xem trong Terminal hệ thống nếu đang chạy giả lập).
        </div>
        <form id="otp-form" onsubmit="handleRegisterStep2(event)">
          <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-primary);">Nhập mã OTP</label>
            <input type="text" id="otp" class="form-control" placeholder="1234" required maxlength="4" style="width: 100%; padding: 12px; font-size: 1.5rem; letter-spacing: 5px; text-align: center;">
          </div>
          <button type="submit" id="btn-verify" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 1rem; font-weight: 700;">Xác nhận Đăng ký</button>
          <button type="button" class="btn btn-ghost" style="width: 100%; padding: 12px; font-size: 1rem; font-weight: 700; margin-top: 10px;" onclick="backToStep1()">Quay lại</button>
        </form>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    let registeredEmail = '';

    async function handleRegisterStep1(e) {
      e.preventDefault();

      const fullName = document.getElementById('fullname').value.trim();
      const userName = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const btn = document.getElementById('btn-register');

      if (!fullName || !userName || !email || !password || !confirmPassword) {
        Toast.warning('Vui lòng điền đầy đủ thông tin!');
        return;
      }

      if (password !== confirmPassword) {
        Toast.error('Mật khẩu nhập lại không khớp!');
        return;
      }

      if (password.length < 3) {
        Toast.warning('Mật khẩu phải có ít nhất 3 ký tự!');
        return;
      }

      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner spinner-sm"></span> Đang gửi OTP...';

      try {
        const res = await Api.post(CONFIG.AUTH_REGISTER, { fullName, userName, email, password });
        if (res.ok) {
          Toast.success('Mã OTP đã được gửi!');
          registeredEmail = email;
          document.getElementById('display-email').textContent = email;
          document.getElementById('step-1').classList.add('hidden');
          document.getElementById('step-2').classList.remove('hidden');
        } else {
          const message = await readApiError(res, 'Gửi yêu cầu thất bại.');
          Toast.error(message);
        }
      } catch (error) {
        Toast.error('Mạng bị lỗi, không thể kết nối tới máy chủ.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    }

    async function handleRegisterStep2(e) {
      e.preventDefault();
      const otp = document.getElementById('otp').value.trim();
      const btn = document.getElementById('btn-verify');

      if (!otp) { Toast.warning('Vui lòng nhập OTP'); return; }

      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner spinner-sm"></span> Đang xác nhận...';

      try {
        const res = await Api.post('/api/auth/verify-register', { email: registeredEmail, otp });
        if (res.ok) {
          Toast.success('Tạo tài khoản thành công! Đang chuyển hướng...');
          setTimeout(() => window.location.href = '/login.html', 1200);
        } else {
          const message = await readApiError(res, 'Xác nhận thất bại.');
          Toast.error(message);
        }
      } catch (error) {
        Toast.error('Mạng bị lỗi.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    }

    function backToStep1() {
      document.getElementById('step-2').classList.add('hidden');
      document.getElementById('step-1').classList.remove('hidden');
    }
  </script>
</body>
</html>
